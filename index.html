<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscar Ensemble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --gold:#D4AF37;
  --gold-dim:#A8892A;
  --gold-glow:rgba(212,175,55,0.18);
  --gold-border:rgba(212,175,55,0.28);
  --bg:#0C0C10;
  --bg2:#13131A;
  --bg3:#1A1A24;
  --bg4:#22222E;
  --surface:#1E1E2A;
  --surface2:#252534;
  --text:#F0EEE8;
  --text2:#A09E96;
  --text3:#6A6860;
  --red:#E05252;
  --green:#4CAF82;
  --blue:#5B8EE0;
  --radius:12px;
  --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
body{padding:0 0 60px;}

/* ── LAYOUT ── */
.wrap{max-width:900px;margin:0 auto;padding:24px 16px;}

/* ── HEADER ── */
.header{text-align:center;padding:32px 20px 24px;position:relative;}
.header-line{width:80px;height:2px;background:var(--gold);margin:0 auto 20px;}
.header-title{font-size:36px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
.header-title span{color:var(--gold);}
.header-sub{font-size:13px;color:var(--text2);letter-spacing:0.1em;text-transform:uppercase;margin-top:8px;}
.header-stars{display:flex;justify-content:center;gap:10px;margin-top:14px;color:var(--gold);font-size:16px;}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
.stat{background:var(--surface);border:1px solid var(--gold-border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
.stat-lbl{font-size:10px;color:var(--gold-dim);letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:4px;}
.stat-val{font-size:22px;font-weight:700;color:var(--text);}

/* ── PROGRESS ── */
.progress-row{display:flex;gap:5px;justify-content:center;margin-bottom:20px;}
.prog-seg{height:4px;border-radius:2px;flex:1;background:var(--bg4);}
.prog-seg.done{background:var(--gold);}
.prog-seg.active{background:rgba(212,175,55,0.5);}

/* ── SPIN AREA ── */
.spin-area{background:var(--surface);border:1px solid var(--gold-border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.spin-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;}
.reels{display:flex;gap:8px;margin-bottom:14px;}
.reel{flex:1;background:var(--bg2);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;min-width:0;}
.reel-lbl{font-size:9px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.reel-val{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.reel.spin-anim .reel-val{color:var(--gold-dim);animation:flicker 0.05s infinite;}
@keyframes flicker{0%{opacity:0.4;}100%{opacity:1;}}
.reel.locked{border-color:var(--gold-border);}
.reel.locked .reel-val{color:var(--gold);}

.spin-btn{width:100%;padding:13px;background:var(--gold);border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;color:#0C0C10;cursor:pointer;letter-spacing:0.02em;transition:background 0.2s,transform 0.1s;}
.spin-btn:hover{background:#C8A030;}
.spin-btn:active{transform:scale(0.98);}
.spin-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;}

/* ── GENRE PICKER ── */
.genre-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.genre-card{background:var(--bg2);border:1px solid rgba(255,255,255,0.07);border-radius:var(--radius);padding:16px 12px;cursor:pointer;text-align:center;transition:border-color 0.15s,background 0.15s;}
.genre-card:hover{border-color:var(--gold-border);background:var(--surface2);}
.genre-icon{font-size:24px;color:var(--gold);margin-bottom:8px;display:block;}
.genre-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;}
.genre-examples{font-size:11px;color:var(--text2);line-height:1.4;}

/* ── DRAFT PANEL ── */
.draft-panel{background:var(--surface);border:1px solid var(--gold-border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.draft-hdr{background:var(--bg2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gold-border);}
.draft-title{font-size:15px;font-weight:700;color:var(--text);}
.draft-sub{font-size:11px;color:var(--gold-dim);margin-top:2px;}
.draft-badge{font-size:11px;color:var(--gold-dim);background:var(--bg3);border:1px solid var(--gold-border);border-radius:20px;padding:2px 10px;}

/* constraint pills */
.constraint-row{display:flex;gap:6px;padding:10px 16px;background:var(--bg3);border-bottom:1px solid rgba(255,255,255,0.04);}
.constraint-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(212,175,55,0.12);color:var(--gold);border:1px solid var(--gold-border);}
.constraint-pill.era{background:rgba(91,142,224,0.12);color:#5B8EE0;border-color:rgba(91,142,224,0.3);}

.cands-scroll{max-height:420px;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}

/* ── CANDIDATE CARD ── */
.cand{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s,background 0.15s,transform 0.12s;}
.cand:last-child{margin-bottom:0;}
.cand:hover{border-color:var(--gold-border);background:var(--surface2);transform:translateY(-2px);}
.cand.best-match{border-color:rgba(76,175,130,0.4);}
.cand.risky{border-color:rgba(224,82,82,0.25);}
.cand-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--bg);flex-shrink:0;}
.cand-body{flex:1;min-width:0;}
.cand-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.cand-name{font-size:14px;font-weight:700;color:var(--text);}
.cand-grade{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;}
.grade-s{background:rgba(212,175,55,0.15);color:var(--gold);}
.grade-a{background:rgba(76,175,130,0.15);color:var(--green);}
.grade-b{background:rgba(91,142,224,0.15);color:var(--blue);}
.grade-c{background:rgba(160,158,150,0.12);color:var(--text2);}
.grade-d{background:rgba(224,82,82,0.12);color:var(--red);}
.match-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(76,175,130,0.15);color:var(--green);}
.mismatch-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(224,82,82,0.1);color:var(--red);}
.cand-films{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;}
.film-chip{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid rgba(255,255,255,0.05);border-radius:20px;padding:2px 9px;}
.cand-attrs{display:flex;flex-wrap:wrap;gap:5px;}
.attr-chip{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--bg3);color:var(--text3);border:1px solid rgba(255,255,255,0.04);}
.attr-chip.match{background:rgba(212,175,55,0.08);color:var(--gold-dim);border-color:var(--gold-border);}
.cand-odds{font-size:12px;font-weight:700;color:var(--gold-dim);margin-left:auto;white-space:nowrap;}

/* ── ROLES GRID ── */
.roles-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.roles-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
.role-card{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);padding:12px 10px;min-height:88px;position:relative;transition:border-color 0.15s;}
.role-card.active{border-color:var(--gold);background:rgba(212,175,55,0.05);}
.role-card.filled{border-color:var(--gold-border);}
.role-icon{font-size:15px;color:var(--gold-dim);margin-bottom:5px;display:block;}
.role-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
.role-person{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;}
.role-empty{font-size:11px;color:var(--text3);margin-top:4px;}
.role-check{position:absolute;top:8px;right:10px;font-size:13px;color:var(--gold-dim);}
.role-card-grade{position:absolute;bottom:8px;right:8px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;}

/* ── SIMULATE BTN ── */
.simulate-btn{width:100%;padding:15px;background:transparent;border:1px solid var(--gold);border-radius:var(--radius-sm);font-size:16px;font-weight:700;color:var(--gold);cursor:pointer;margin-bottom:20px;letter-spacing:0.03em;transition:background 0.2s;}
.simulate-btn:hover{background:rgba(212,175,55,0.08);}
.simulate-btn:disabled{opacity:0.25;cursor:not-allowed;}

/* ── RESULT ── */
.result-box{background:var(--surface);border:1px solid var(--gold-border);border-radius:var(--radius);padding:28px 24px;text-align:center;margin-bottom:20px;}
.result-icon{font-size:44px;color:var(--gold);margin-bottom:10px;}
.result-hl{font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px;}
.result-oscars{font-size:56px;font-weight:800;color:var(--gold);line-height:1;}
.result-oscars-word{font-size:14px;color:var(--text2);margin-bottom:16px;}
.result-stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:16px;}
.result-stat-item{text-align:center;}
.result-stat-item span{font-size:10px;color:var(--text3);display:block;text-transform:uppercase;letter-spacing:0.07em;}
.result-stat-item strong{font-size:18px;font-weight:700;color:var(--text);}
.result-bar-wrap{background:rgba(212,175,55,0.1);height:6px;border-radius:3px;overflow:hidden;margin:0 0 14px;}
.result-bar{height:100%;background:var(--gold);border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}
.result-verdict{font-size:13px;color:var(--text2);line-height:1.6;max-width:480px;margin:0 auto 20px;}
.cast-table{text-align:left;border-top:1px solid rgba(212,175,55,0.15);padding-top:16px;}
.cast-row2{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.cast-row2:last-child{border-bottom:none;}
.cast-role-lbl{font-size:11px;color:var(--text3);}
.cast-name-lbl{font-size:12px;font-weight:600;color:var(--text);}
.cast-grade-lbl{font-size:11px;font-weight:700;margin-left:8px;}
.play-again{width:100%;margin-top:18px;padding:12px;background:transparent;border:1px solid var(--gold-border);border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--gold-dim);cursor:pointer;transition:border-color 0.15s;}
.play-again:hover{border-color:var(--gold);}
</style>
</head>

<div id="genre-area" style="display:none;">

<div class="draft-panel" id="draft-panel" style="display:none;">

</div>

<div style="margin-bottom:20px;">

</div>

<button class="simulate-btn" id="simulate-btn" onclick="simulate()" disabled>
  <i class="ti ti-trophy"></i> &nbsp;Simulate awards season
</button>

<div id="result-area" style="display:none;"></div>

</div>

const AVATAR_COLORS=['#7C5CBF','#2E8B57','#C0392B','#2471A3','#B7950B','#1E8449','#884EA0','#1A5276','#B03A2E'];

function getAvatarColor(name){
  let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))&0xFFFFFF;
  return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];
}
function initials(name){
  const p=name.trim().split(/\s+/);
  if(p.length>=2)return(p[0][0]+p[p.length-1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}

  ROLES.forEach((_,i)=>{

/* ── ERA spin groups — pick one era bucket ── */
const ERA_SPIN_LABELS={
  classic:'Classic Hollywood (pre-1960)',
  newhollywood:'New Hollywood (1960s–70s)',
  eighties:'Blockbuster era (1980s)',
  nineties:'Golden 90s (1990s)',
  twothousands:'2000s prestige',
  tens:'Modern (2010s)',
  twenties:'Recent (2020s)',
};

/* ── BONUS spin pool (never name-range contradictions) ── */
const BONUS_SPIN_POOL=[
  {id:'winner',label:'Won an Oscar'},
  {id:'nowin',label:'Never won an Oscar'},
  {id:'rt90',label:'RT score 90%+'},
  {id:'rt80',label:'RT score below 80%'},
  {id:'bofhit',label:'Major box-office hit'},
  {id:'cult',label:'Cult following'},
  {id:'foreign',label:'Foreign-born talent'},
  {id:'american',label:'American-born'},
  {id:'stage',label:'Stage / theatre background'},
  {id:'method',label:'Known for method acting'},
  {id:'nameAF',label:'Last name: A–F'},
  {id:'nameGL',label:'Last name: G–L'},
  {id:'nameMR',label:'Last name: M–R'},
  {id:'nameSZ',label:'Last name: S–Z'},
];

function randEra(){
  const keys=Object.keys(ERA_SPIN_LABELS);
  return keys[Math.floor(Math.random()*keys.length)];
}
function randBonus(excludeIds=[]){
  const pool=BONUS_SPIN_POOL.filter(b=>!excludeIds.includes(b.id));
  return pool[Math.floor(Math.random()*pool.length)];
}

const NAME_BONUS_IDS=['nameAF','nameGL','nameMR','nameSZ'];
function pickConstraints(){
  const eraId=randEra();
  const b=randBonus(NAME_BONUS_IDS.includes('x')?[]:[]); /* always safe since era≠bonus */
  return {eraId, bonusId:b.id, eraLabel:ERA_SPIN_LABELS[eraId], bonusLabel:b.label};
}

function candidatePasses(p, eraId, bonusId){
  const eraPasses = p.era===eraId;
  const bonusPasses = p.bonus&&p.bonus.includes(bonusId);
  return {eraPasses, bonusPasses};
}

const SPIN_WORDS=['Drama','Epic','Thriller','True Story','1970s','Foreign','Method','Stage','A–F','Winner','90%+','Classic','Auteur','Modern','Indie'];

function doSpin(){
  const unfilled=ROLES.filter(r=>!picks[r.id]);
  if(!unfilled.length)return;
  const target=unfilled[Math.floor(Math.random()*unfilled.length)];
  currentRole=target.id;

  document.getElementById('spin-btn').disabled=true;
  document.getElementById('draft-panel').style.display='none';
  document.getElementById('genre-area').style.display='none';

  const rv=[document.getElementById('rv0'),document.getElementById('rv1'),document.getElementById('rv2')];
  rv.forEach(el=>{if(el)el.parentElement.className='reel spin-anim';});

  const finalRole=ROLES.find(r=>r.id===target.id).label;
  let constraints=null;
  if(target.id!=='genre') constraints=pickConstraints();

  let t=0;
  const iv=setInterval(()=>{
    rv.forEach((el,i)=>{
      if(!el)return;
      if(i===0)el.textContent=ROLES[Math.floor(Math.random()*ROLES.length)].label;
      else el.textContent=SPIN_WORDS[Math.floor(Math.random()*SPIN_WORDS.length)];
    });
    t++;
    if(t>16){
      clearInterval(iv);
      rv.forEach((el,i)=>{if(el)el.parentElement.className='reel locked';});
      if(rv[0])rv[0].textContent=finalRole;
      if(target.id==='genre'){
        if(rv[1])rv[1].textContent='Pick any';
        if(rv[2])rv[2].textContent='3 choices';
        showGenrePicker();
      } else {
        if(rv[1])rv[1].textContent=constraints.eraLabel;
        if(rv[2])rv[2].textContent=constraints.bonusLabel;
        currentConstraints=constraints;
        showCandidates(target.id, constraints);
      }
      renderGrid();
    }
  },55);
}

function showGenrePicker(){
  const indices=[];
  while(indices.length<3){const i=Math.floor(Math.random()*GENRES.length);if(!indices.includes(i))indices.push(i);}
  const picker=document.getElementById('genre-picker');
  picker.innerHTML=indices.map(i=>{
    const g=GENRES[i];
    return `<div class="genre-card" onclick="pickGenre(${i})">
      <i class="ti ${g.icon} genre-icon"></i>
      <div class="genre-name">${g.name}</div>
      <div class="genre-examples">${g.examples}</div>
    </div>`;
  }).join('');
  document.getElementById('genre-area').style.display='block';
}

function pickGenre(idx){
  picks['genre']={...GENRES[idx],n:GENRES[idx].name,grade:'A'};
  document.getElementById('genre-area').style.display='none';
  document.getElementById('spin-btn').disabled=false;
  currentRole=null;
  renderGrid();
  if(Object.keys(picks).length===8){document.getElementById('spin-btn').disabled=true;}
}

function showCandidates(roleId, constraints){
  const pool=DB[roleId];
  if(!pool){return;}

  const scored=pool.map(p=>{
    const pn=p.n||p.name||'';
    const {eraPasses,bonusPasses}=candidatePasses(p,constraints.eraId,constraints.bonusId);
    const matches=(eraPasses?1:0)+(bonusPasses?1:0);
    return{...p,matches,eraPasses,bonusPasses};
  });

  /* Partition: full match (2), partial (1), none (0) */
  const full=scored.filter(p=>p.matches===2).sort((a,b)=>{const go={S:4,A:3,B:2,C:1,D:0};return go[b.grade]-go[a.grade];});
  const partial=scored.filter(p=>p.matches===1).sort((a,b)=>{const go={S:4,A:3,B:2,C:1,D:0};return go[b.grade]-go[a.grade];});
  const none=scored.filter(p=>p.matches===0).sort((a,b)=>{const go={S:4,A:3,B:2,C:1,D:0};return go[b.grade]-go[a.grade];});

  /* Always show: all full matches + at least some partial/none so there are always risky picks */
  currentCandidates=[...full,...partial,...none];

  const roleName=ROLES.find(r=>r.id===roleId).label;
  document.getElementById('draft-title').textContent='Choose your '+roleName;
  document.getElementById('draft-sub').textContent=full.length+' perfect matches · '+partial.length+' partial · '+none.length+' off-constraint';
  document.getElementById('draft-badge').textContent=currentCandidates.length+' candidates';

  /* Constraint pills */
  document.getElementById('constraint-row').innerHTML=
    `<div class="constraint-pill era"><i class="ti ti-calendar-time" style="font-size:11px;margin-right:4px"></i>${constraints.eraLabel}</div>`+
    `<div class="constraint-pill"><i class="ti ti-sparkles" style="font-size:11px;margin-right:4px"></i>${constraints.bonusLabel}</div>`;

  document.getElementById('cands-scroll').innerHTML=currentCandidates.map((p,i)=>{
    const pn=p.n||p.name||'?';
    const color=getAvatarColor(pn);
    const init=initials(pn);
    const matchLabel=p.matches===2?'<span class="match-tag">2/2 match</span>':p.matches===1?'<span class="match-tag" style="background:rgba(212,175,55,0.12);color:var(--gold-dim)">1/2 match</span>':'<span class="mismatch-tag">No match</span>';
    const eraChip=`<span class="attr-chip ${p.eraPasses?'match':''}">${ERA_SPIN_LABELS[p.era]||p.era}</span>`;
    const bonusChips=(p.bonus||[]).slice(0,4).map(b=>{
      const bl=BONUS_SPIN_POOL.find(x=>x.id===b);
      const isMatch=b===constraints.bonusId;
      return `<span class="attr-chip ${isMatch?'match':''}">${bl?bl.label:b}</span>`;
    }).join('');
    const gradeClass='grade-'+p.grade.toLowerCase();
    const films=(p.films||[]).map(f=>`<span class="film-chip">${f}</span>`).join('');
    const cardClass=p.matches===2?'cand best-match':p.matches===0?'cand risky':'cand';
    return `<div class="${cardClass}" onclick="draftPick(${i})">
      <div class="cand-avatar" style="background:${color}">${init}</div>
      <div class="cand-body">
        <div class="cand-top">
          <span class="cand-name">${pn}</span>
          <span class="cand-grade ${gradeClass}">${p.grade}</span>
          ${matchLabel}
        </div>
        <div class="cand-films">${films}</div>
        <div class="cand-attrs">${eraChip}${bonusChips}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('draft-panel').style.display='block';
  document.getElementById('draft-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function draftPick(idx){
  picks[currentRole]=currentCandidates[idx];
  document.getElementById('draft-panel').style.display='none';
  document.getElementById('spin-btn').disabled=false;
  currentRole=null;
  renderGrid();
  if(Object.keys(picks).length===8){
    document.getElementById('spin-btn').disabled=true;
  }
}

function gradeScore(g){return{S:95,A:85,B:72,C:58,D:42}[g]||70;}

function simulate(){
  const entries=Object.entries(picks);
  const scores=entries.map(([id,p])=>gradeScore(p.grade));
  const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
  const dir=gradeScore(picks.director?.grade||'B');
  const gen=picks.genre?.score||82;
  const la=gradeScore(picks.lead_actor?.grade||'B');
  const lac=gradeScore(picks.lead_actress?.grade||'B');
  const composite=(avg*0.35+dir*0.25+gen*0.08+la*0.16+lac*0.16);
  const rawOscars=((composite-55)/45)*11;
  const oscars=Math.max(0,Math.min(11,Math.round(rawOscars)));
  const noms=Math.min(19,oscars+Math.floor(Math.random()*5)+3);
  const bo=Math.round((composite/100)*380+Math.random()*100);
  const crit=Math.min(99,Math.round(composite+Math.random()*10-5));

  document.getElementById('s-oscars').textContent=oscars;
  document.getElementById('s-noms').textContent=noms;
  document.getElementById('s-bo').textContent='$'+bo+'M';
  document.getElementById('s-crit').textContent=crit+'%';

  const icon=oscars>=9?'ti-trophy':oscars>=5?'ti-award':'ti-star';
  const hl=oscars>=9?'Historic Sweep':oscars>=6?'Major Award Winner':oscars>=3?'Strong Contender':'Awards Season Entrant';
  const verdict=oscars>=9?'Your ensemble swept the night. A performance for the history books — every category was yours.':
    oscars>=6?'The Academy took notice. A dominant run through the major categories with real hardware to show for it.':
    oscars>=3?'A respectable awards run with wins in key categories. Critics and audiences both responded.':
    'A tough draw from the constraints. The competition was fierce and the ensemble couldn\'t quite crack the top tier.';

  const breakdownRows=ROLES.map(r=>{
    const p=picks[r.id];
    if(!p)return'';
    const pn=p.n||p.name||'?';
    const gc=GRADE_COLORS[p.grade]||'#aaa';
    return `<div class="cast-row2">
      <span class="cast-role-lbl">${r.label}</span>
      <span class="cast-name-lbl">${pn}<span class="cast-grade-lbl" style="color:${gc}">${p.grade}</span></span>
    </div>`;
  }).join('');

  const pct=Math.round((oscars/11)*100);
  document.getElementById('result-area').innerHTML=`
    <div class="result-box">
      <div class="result-icon"><i class="ti ${icon}"></i></div>
      <div class="result-hl">${hl}</div>
      <div class="result-oscars">${oscars}</div>
      <div class="result-oscars-word">Oscar${oscars!==1?'s':''} won</div>
      <div class="result-stats-row">
        <div class="result-stat-item"><span>Nominations</span><strong>${noms}</strong></div>
        <div class="result-stat-item"><span>Critics</span><strong>${crit}%</strong></div>
        <div class="result-stat-item"><span>Box office</span><strong>$${bo}M</strong></div>
      </div>
      <div class="result-bar-wrap"><div class="result-bar" id="rbar" style="width:0%"></div></div>
      <div class="result-verdict">${verdict}</div>
      <div class="cast-table">${breakdownRows}</div>
      <button class="play-again" onclick="resetGame()"><i class="ti ti-refresh"></i> &nbsp;Play again</button>
    </div>
  `;
  document.getElementById('result-area').style.display='block';
  document.getElementById('result-area').scrollIntoView({behavior:'smooth'});
  setTimeout(()=>{const b=document.getElementById('rbar');if(b)b.style.width=pct+'%';},150);
}

function resetGame(){
  picks={};currentRole=null;currentConstraints=null;currentCandidates=[];
  ['draft-panel','genre-area','result-area'].forEach(id=>{document.getElementById(id).style.display='none';});
  document.getElementById('spin-btn').disabled=false;
  document.getElementById('s-oscars').textContent='—';
  document.getElementById('s-noms').textContent='—';
  document.getElementById('s-bo').textContent='—';
  document.getElementById('s-crit').textContent='—';
  ['rv0','rv1','rv2'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent='—';el.parentElement.className='reel';}});
  renderGrid();
  window.scrollTo({top:0,behavior:'smooth'});
}

initProgress();
renderGrid();
</script>
</body>
</html>
